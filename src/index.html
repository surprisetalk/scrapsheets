<!DOCTYPE html>
<html lang="en">
  <head>
    <title>scrapsheets</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Taylor Troesh" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link href="/style.css" rel="stylesheet" />
    <script src="/index.js"></script>
  </head>
  <body>
    <div id="elm"></div>
    <script type="importmap">
      {
        "imports": {
          "@automerge/automerge": "/automerge.mjs",
          "@automerge/automerge/slim": "/automerge.mjs",
          "@automerge/automerge-repo": "/automerge-repo.mjs",
          "@automerge/automerge-repo/slim": "/automerge-repo.mjs"
        }
      }
    </script>
    <script type="module">
      // Initialize Automerge WASM first
      import { initializeWasm } from "@automerge/automerge";
      await initializeWasm(fetch("/automerge.wasm"));

      // Import Automerge packages
      import { cbor, Repo } from "@automerge/automerge-repo";
      import { IndexedDBStorageAdapter } from "/automerge-repo-idb.mjs";
      import { BrowserWebSocketClientAdapter } from "/automerge-repo-ws.mjs";
      import {
        API_BASE,
        docThumb,
        foldView,
        httpErrorDetail,
        httpFailure,
        httpTarget,
        httpUnparsed,
        httpUnreachable,
        library,
        mergeView,
        PARSERS,
        sheets,
      } from "/page.mjs";
      import {
        chartSql,
        checkResultColumns,
        describeRef,
        formatQueryError,
        register,
      } from "/sql.mjs";
      import alasql from "/alasql.mjs";
      // The same host the fetches use, over the scheme a socket takes.
      const WS_BASE = API_BASE.replace(/^http/, "ws");
      // Was a CDN <script> that defined a global. Keep the global so query code
      // and the browser tests can reach it the same way.
      globalThis.alasql = alasql;

      function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            func.apply(this, args);
          }, timeout);
        };
      }

      // Everything this browser remembers, under one prefix and through one
      // parse. `fallback` is what a missing or unparseable entry reads as: a
      // page that will not load because one saved preference is corrupt is
      // worse than one that forgets it.
      const Stored = {
        get: (name, fallback = {}) => {
          try {
            const raw = localStorage.getItem(`scrapsheets-${name}`);
            return raw === null ? fallback : JSON.parse(raw);
          } catch {
            return fallback;
          }
        },
        set: (name, value) => localStorage.setItem(`scrapsheets-${name}`, JSON.stringify(value)),
        clear: (name) => localStorage.removeItem(`scrapsheets-${name}`),
      };

      // Declared out here so the catch below can still reach it. Inside the try
      // it is out of scope exactly when the handler runs.
      let app;
      try {
        app = Elm.Main.init({
          node: document.getElementById("elm"),
          flags: {
            api: API_BASE,
            tutorial: Stored.get("tutorial", 0),
          },
        });

        app.ports.saveTutorial.subscribe((n) =>
          Stored.set("tutorial", n),
        );

        // Debug logging - set localStorage.debug = 'scrapsheets' to enable verbose logging
        const VERBOSE = localStorage.getItem('debug')?.includes('scrapsheets');
        const debug = {
          log: VERBOSE ? (...args) => console.log('[scrapsheets]', ...args) : () => {},
          error: (...args) => console.error('[scrapsheets]', ...args),
          warn: (...args) => console.warn('[scrapsheets]', ...args),
        };

        function catchy(func, context = 'unknown') {
          return (...args) => {
            try {
              return func.apply(this, args)?.catch((error) => {
                debug.error(`Error in ${context}:`, error);
                app.ports.docErrored.send(
                  `[${context}] ${error?.message ?? "Something went wrong."}`,
                );
              });
            } catch (error) {
              debug.error(`Sync error in ${context}:`, error);
              app.ports.docErrored.send(
                `[${context}] ${error?.message ?? "Something went wrong."}`,
              );
            }
          };
        }

        const Library = {
          // Memoized: docThumb over the bundled datasets is too costly per call.
          cache: null,
          get: () =>
            Library.cache ??= library(Stored.get("library")),
          // `stored`, not `library`: the imported library() builds the merged
          // shelf, and shadowing it here would be a trap for whoever edits next.
          set: (id, info) => {
            for (const i in info) if (info[i] === null) delete info[i];
            const stored = Stored.get("library");
            Stored.set("library", { ...stored, [id]: { ...stored[id], ...info } });
            Library.cache = null;
            app.ports.librarySynced.send(Library.get());
          },
          delete: (id) => {
            Stored.set("library", { ...Stored.get("library"), [id]: undefined });
            Library.cache = null;
            app.ports.librarySynced.send(Library.get());
          },
        };
        app.ports.librarySynced.send(Library.get());

        // The arrangement this browser holds for sheets whose document cannot
        // hold it: one that ships bundled, and one the sync server has refused a
        // write on. Each value is a partial of that sheet's `data[0]`, in the
        // shape the arrangement patches address, so it merges back the way it
        // was written. A cell edit never lands here -- `arrangeDoc` is the one
        // port that reaches it, and only view fields go out on it.
        const Views = {
          keep: (id, patches) =>
            Stored.set("views", { ...Stored.get("views"), [id]: foldView(Stored.get("views")[id], patches) }),
          // Only on the way in. What is stored is never written back into a
          // document that is not ours.
          shown: (id, doc) => {
            const held = Stored.get("views")[id];
            if (!held || !Array.isArray(doc?.data) || !doc.data.length) return doc;
            return { ...doc, data: [mergeView(doc.data[0], held), ...doc.data.slice(1)] };
          },
        };
        // Documents the sync server has refused a write on. It answers on
        // doc_id, so this is keyed the same way.
        const refused = new Set();
        // The arrangement last sent for a synced sheet. A refusal arrives after
        // the write, so without this the first one after a page load is the one
        // that gets lost.
        let lastArranged = null;

        app.ports.deleteDoc.subscribe(async (id) => Library.delete(id));

        app.ports.updateLibrary.subscribe(({ id, data }) => Library.set(id, data));

        // Query editor autocomplete
        const setupQueryEditorTracking = () => {
          const codeEditor = document.getElementById('code');
          if (!codeEditor) return;

          // Track cursor position on input and selection change
          const reportState = () => {
            if (!app.ports.queryEditorState) return;
            const cursorPos = codeEditor.selectionStart;
            const textBeforeCursor = codeEditor.value.substring(0, cursorPos);
            app.ports.queryEditorState.send({ cursorPos, textBeforeCursor });
          };

          codeEditor.addEventListener('input', reportState);
          codeEditor.addEventListener('click', reportState);
          codeEditor.addEventListener('keyup', (e) => {
            // Report on arrow keys and other navigation
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
              reportState();
            }
          });

          // Handle autocomplete keyboard navigation
          codeEditor.addEventListener('keydown', (e) => {
            // Check if autocomplete is showing (hacky but works)
            const dropdown = document.querySelector('[style*="z-index: 100"]');
            if (!dropdown) return;

            if (e.key === 'ArrowDown') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -1, textBeforeCursor: '__NAV_DOWN__' });
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -2, textBeforeCursor: '__NAV_UP__' });
            } else if (e.key === 'Enter' || e.key === 'Tab') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -3, textBeforeCursor: '__SELECT__' });
            } else if (e.key === 'Escape') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -4, textBeforeCursor: '__CLOSE__' });
            }
          });
        };

        // Insert text at cursor in query editor
        app.ports.insertAtCursor.subscribe((text) => {
          const codeEditor = document.getElementById('code');
          if (!codeEditor) return;

          const start = codeEditor.selectionStart;
          const end = codeEditor.selectionEnd;
          const value = codeEditor.value;

          codeEditor.value = value.substring(0, start) + text + value.substring(end);
          codeEditor.selectionStart = codeEditor.selectionEnd = start + text.length;
          codeEditor.focus();

          // Trigger input event so Elm gets the updated value
          codeEditor.dispatchEvent(new Event('input', { bubbles: true }));
        });

        // Re-setup editor tracking when DOM changes (e.g., navigating to a query)
        const observer = new MutationObserver(() => {
          if (document.getElementById('code')) {
            setupQueryEditorTracking();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Clipboard handling
        app.ports.copyToClipboard.subscribe(async (text) => {
          try {
            await navigator.clipboard.writeText(text);
            debug.log('Copied to clipboard:', text.substring(0, 50) + '...');
          } catch (err) {
            debug.error('Failed to copy:', err);
          }
        });

        // Listen for paste events and send to Elm
        document.addEventListener('paste', (e) => {
          // Don't intercept paste when typing in an input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
          }
          e.preventDefault();
          const text = e.clipboardData.getData('text/plain');
          if (text && app.ports.pasteFromClipboard) {
            app.ports.pasteFromClipboard.send(text);
          }
        });

        // Listen for copy events
        document.addEventListener('copy', (e) => {
          // Don't intercept copy when selecting text in an input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
          }
          // The actual copy is triggered via port, so we just let Elm know
          if (app.ports.requestCopy) {
            e.preventDefault();
            app.ports.requestCopy.send(null);
          }
        });

        {
          // Initialize the Automerge Repo with storage and network adapters
          const getAuthToken = () => Stored.get("user").jwt ?? null;

          // `library:freshness` is a sheet the server computes rather than
          // stores, and this is the same answer GET /sheet/library:freshness
          // gives -- no new endpoint. It is read here rather than in Elm for the
          // reason sharing is: the JWT lives in this file. No token means no
          // request and no answer at all, so the library's column is absent
          // rather than a row of blanks that would read as "nothing is wrong".
          const loadFreshness = catchy(async () => {
            const token = getAuthToken();
            if (!token) return;
            // Above the default page of 50. A truncated answer would report a
            // rotten feed as a sheet with no freshness at all.
            const res = await fetch(
              `${API_BASE}/library/freshness?limit=1000`,
              { headers: { Authorization: `Bearer ${token}` } },
            );
            if (!res.ok)
              throw new Error(
                `Could not read feed health (${res.status}): ${
                  httpErrorDetail(await res.text(), res.headers.get("Content-Type") ?? "")
                }`,
              );
            const { data } = await res.json();
            // data[0] is the column list, as every paged read sends it.
            app.ports.freshnessLoaded.send(data.slice(1));
          }, 'freshness');
          loadFreshness();
          // A tab left open on the library has to see a feed die without a
          // reload, which is the whole point of not waiting for the status email.
          setInterval(loadFreshness, 60000);

          // Sharing lives here rather than in Elm because the JWT does. Every
          // action re-reads the member list, so the modal never shows stale state.
          //
          // Every answer names its sheet and its action. Without the id, a list
          // for sheet A that resolved after the user opened sheet B wrote A's
          // members and public flag into B's panel; without the action, a field
          // that was renamed away looked exactly like a field that was never
          // sent, so the one thing this payload cannot report is the one thing
          // it most needs to.
          app.ports.shareAction.subscribe(catchy(async ({ id, action, email, role, public: isPublic, days, password }) => {
            const token = getAuthToken();
            if (!token) {
              return app.ports.docErrored.send("Log in to share a sheet.");
            }
            const api = `${API_BASE}/library/${id}`;
            const send = async (path, method, body) => {
              const res = await fetch(api + path, {
                method,
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
              // As text, through the same reader the freshness call uses. Every
              // refusal on these routes is an HTTPException carrying an
              // explain() block, and Hono answers one with no `res` as plain
              // text -- so reading it as JSON threw, was swallowed, and left
              // "POST /link failed (400)." in place of a message that named the
              // field, the bound and the fix.
              if (!res.ok) {
                throw new Error(
                  httpErrorDetail(await res.text(), res.headers.get("Content-Type") ?? "") ||
                    `${method} ${path} failed (${res.status}).`,
                );
              }
              return await res.json();
            };

            let link;
            if (action === "add") await send("/share", "POST", { email, role });
            else if (action === "remove") await send("/share", "DELETE", { email });
            else if (action === "public") await send("/public", "POST", { public: isPublic });
            else if (action === "link") {
              // Zero days and an empty password are "not asked for", and an
              // empty body is what the server reads as the default link, so an
              // untouched panel keeps minting the thirty-day unlocked one.
              // The password is never put in the link: a lock the url carries
              // is not a lock.
              const { data } = await send("/link", "POST", {
                ...(days ? { days } : {}),
                ...(password ? { password } : {}),
              });
              link = `${location.origin}/${id}?share=${data.token}`;
            } else if (action === "hook") {
              // A net sheet's signing secret. It returns here rather than falling
              // through to the member list: this panel is the aside, not the
              // settings modal, and it asked one question.
              const { data } = await send("/hook", "GET");
              return app.ports.shareLoaded.send({ id, action, hook: data });
            }

            const { data } = await send("/share", "GET");
            app.ports.shareLoaded.send({ id, action, members: data.members, public: data.public, ...(link ? { link } : {}) });
          }, 'shareAction'));

          // Register a document with the server, retrying on 404 (sync timing)
          async function registerDocWithRetry(id, name) {
            const token = getAuthToken();
            if (!token) return true; // No auth, skip registration

            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt > 0) {
                await new Promise(r => setTimeout(r, 100 * Math.pow(2, attempt)));
              }
              const res = await fetch(`${API_BASE}/library/${id}`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`,
                },
                body: JSON.stringify({ name: name ?? "", tags: [] }),
              });
              if (res.ok) return true;
              if (res.status !== 404) break; // Only retry on 404 (sync timing)
            }
            return false;
          }

          // A ?share= token in the URL is a view-only credential for one sheet;
          // it rides the same ?auth= parameter, so there is one read path.
          const shareToken = new URLSearchParams(location.search).get("share");
          const token = getAuthToken() ?? shareToken;

          // Whether this link was minted with a password. The claim is a hint
          // and never a decision -- verifyWsAuth is still the only thing that
          // checks a password, and the only place the share claim is read at
          // all. It is asked for before the socket opens because the refusal
          // lands in the handshake as an HTTP 401, which script cannot read:
          // without this, a locked link is a sheet that spends twenty seconds
          // failing to load and then says nothing about why.
          const isLocked = (jwt) => {
            try {
              const claims = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
              return !!JSON.parse(atob(claims + "=".repeat((4 - claims.length % 4) % 4))).lock;
            } catch {
              // Unreadable is not locked: the server refuses an unreadable
              // token on its own, and asking for a password here would be
              // asking for one against a check that will never run.
              return false;
            }
          };
          // Only when the share token is the credential being used. A logged-in
          // reader's own JWT wins above, so their sheet is not gated on a
          // password for a link they are not opening with.
          const linkPass = token === shareToken && shareToken && isLocked(shareToken)
            ? prompt("This link is locked. Enter the password it was minted with:")
            : null;
          const syncUrl =
            WS_BASE + "/library/sync" +
            (token ? `?auth=Bearer%20${encodeURIComponent(token)}` : "") +
            (linkPass ? `&pass=${encodeURIComponent(linkPass)}` : "");

          // Track sync connection status
          const syncStatus = {
            connected: false,
            lastError: null,
            attempts: 0,
          };

          debug.log('Initializing repo with sync URL:', syncUrl);
          const networkAdapter = new BrowserWebSocketClientAdapter(syncUrl);

          // The sync server refuses a viewer's write with a `type: "error"`
          // frame naming the document. The vendored adapter logs that frame to a
          // debug namespace and emits nothing, so the one method that sees it is
          // the only place it can be read. Two things hang off it: the writer is
          // told the edit was not saved, which nothing did before, and the
          // arrangement that was refused is kept in this browser instead.
          // Through `catchy` so that a full localStorage cannot take the sync
          // socket down with it: this runs inside the adapter's message handler.
          const onRefused = catchy((frame) => {
            refused.add(frame.documentId);
            if (lastArranged?.doc_id === frame.documentId) Views.keep(lastArranged.id, lastArranged.patches);
            app.ports.docErrored.send(frame.message ?? "That edit was not saved.");
          }, 'sync refusal');
          const receiveMessage = networkAdapter.receiveMessage.bind(networkAdapter);
          networkAdapter.receiveMessage = (data) => {
            let frame;
            try {
              frame = cbor.decode(new Uint8Array(data));
            } catch {
              // The adapter reports its own decode failure. Two reports of one
              // fault is one report too many.
            }
            if (frame?.type === "error" && frame.documentId) onRefused(frame);
            return receiveMessage(data);
          };

          const repo = new Repo({
            storage: new IndexedDBStorageAdapter(),
            network: [networkAdapter],
          });

          // Log repo events if available
          if (repo.on) {
            repo.on('document', ({ handle }) => {
              debug.log('Repo received document:', handle.documentId);
            });
          }

          // Expose debug info globally for console access
          window.__scrapsheets = {
            repo,
            syncStatus,
            Library,
            getDocState: (id) => {
              const [type, doc_id] = id.split(':');
              const inLibrary = Library.get()[id];
              return {
                id,
                type,
                doc_id,
                inLibrary: !!inLibrary,
                libraryEntry: inLibrary,
                repoHandles: repo.handles ? Object.keys(repo.handles) : 'N/A',
              };
            },
          };

          let sheet;

          const setupDragDrop = () => {
            document.body.addEventListener("dragover", (e) => {
              e.preventDefault();
              e.stopPropagation();
              e.dataTransfer.dropEffect = "copy";
              document.body.classList.add("drag-over");
            });
            document.body.addEventListener("dragleave", (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.body.classList.remove("drag-over");
            });
            document.body.addEventListener("drop", async (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.body.classList.remove("drag-over");
              const files = Array.from(e.dataTransfer.files).filter(
                (file) =>
                  file.type === "text/csv" ||
                  file.name.endsWith(".csv"),
              );
              for (const file of files) {
                try {
                  const lines = (await file.text())
                    .split("\n")
                    .filter((line) => line.trim());
                  if (!lines.length) return null;
                  const [headers, ...data] = lines.map((row) => {
                    const result = [];
                    let current = "";
                    let inQuotes = false;
                    for (let i = 0; i < row.length; i++) {
                      const char = row[i];
                      if (char === '"') {
                        if (inQuotes && row[i + 1] === '"') {
                          current += '"';
                          i++;
                        } else {
                          inQuotes = !inQuotes;
                        }
                      } else if (char === "," && !inQuotes) {
                        result.push(current.trim());
                        current = "";
                      } else {
                        current += char;
                      }
                    }
                    result.push(current.trim());
                    return result;
                  });
                  if (!headers.length) return;
                  const newSheet = repo.create({
                    type: "table",
                    data: [
                      headers.map((name, key) => ({
                        name,
                        type: "text",
                        key,
                      })),
                      ...data.map((row) => {
                        const rowObj = {};
                        headers.forEach((_, index) => {
                          rowObj[index] = row[index] || "";
                        });
                        return rowObj;
                      }),
                    ],
                  });
                  const id = `table:${newSheet.documentId}`;
                  const csvName = file.name.replace(/\.csv$/i, "");
                  Library.set(id, { name: csvName, tags: [] });

                  // Register document in database with retry for sync timing
                  const registered = await registerDocWithRetry(id, csvName);
                  if (!registered) {
                    console.error("Failed to register CSV document after retries");
                    app.ports.docErrored.send("Failed to save imported file. Please try again.");
                    return;
                  }

                  requestAnimationFrame(() => {
                    window.location = `/${id}`;
                  });
                } catch (error) {
                  console.error("Error processing CSV file:", error);
                  app.ports.docErrored.send(
                    `Error processing ${file.name}: ${error.message}`,
                  );
                }
              }
            });
          };
          if (document.readyState === "loading") {
            document.addEventListener(
              "DOMContentLoaded",
              setupDragDrop,
            );
          } else { setupDragDrop(); }

          alasql.options.modifier = "RECORDSET";
          register(alasql);
          for (
            const type of [
              "image",
              "link",
              "usd",
              "percentage",
              "date",
              "int",
              "float",
            ]
          ) {
            alasql.fn[type] = (data) => ({ type, data });
          }
          // The resolver lives in /page.mjs so a test can drive it: everything it
          // needs from this file is the library map and a way to find a document.
          const { runSql, columns: sheetColumns } = sheets(
            alasql,
            Library.get,
            (doc_id) => repo.find(doc_id).then(async (h) => (await h.whenReady?.(), h.doc())),
          );
          // Pull the origin's own words out of an error body so the message names a cause,
          // not just a status code (arxiv hides it in <entry><summary>, most APIs in JSON).
          alasql.fn.http = (url, qs = {}) => {
            if (!url) return;
            // Anything that is not ours goes through the server's proxy: the
            // browser will not allow the request, and the SSRF guard lives there.
            const { url: targetUrl, full: fullUrl, viaProxy } = httpTarget(url, qs, window.location.origin);
            const request = new XMLHttpRequest();
            request.open(
              "GET",
              targetUrl,
              false,
            ); // `false` makes the request synchronous
            request.send(null);
            const contentType = request
              .getResponseHeader("Content-Type")
              ?.replace(/;.*$/, "") || "application/json";
            if (!request.status) throw new Error(httpUnreachable(fullUrl));
            // The proxy forwards the origin status verbatim, so X-Proxy-Status tells
            // us whether the origin or the proxy itself rejected the request.
            if (request.status >= 400)
              throw new Error(httpFailure({
                status: request.status,
                url: fullUrl,
                body: request.responseText,
                contentType,
                rejectedByProxy: viaProxy && !request.getResponseHeader("X-Proxy-Status"),
              }));
            try {
              return {
                status: request.status,
                res: (PARSERS[contentType] ?? JSON.parse)(request.responseText) || null,
              };
            } catch (err) {
              throw new Error(httpUnparsed({
                url: fullUrl,
                contentType,
                body: request.responseText,
                message: err.message,
              }));
            }
          };
          alasql.from.HTTP = (url, qs = {}) => alasql.fn.http(url, qs).res;
          const queryDoc = debounce(
            async (id, { code, lang, cols: cols_ = {} }) => {
              try {
                switch (lang) {
                  case "sql":
                    // TODO: Run alasql if possible, otherwise post to /query.
                    const params = new URLSearchParams(window.location.search)
                      .get("q")
                      ?.split(/\s+(?=\w+=)/)
                      .reduce(
                        (r, p) => {
                          const [k, v] = p.includes("=") ? p.split("=") : ["", p];
                          return ((r[k] ||= []).push(v), r);
                        },
                        { "": [].join(" ") },
                      ) ?? { "": null };
                    // describe is answered by runSql itself, the same way the
                    // server answers it, and is the one statement whose columns
                    // are not the query's own -- so it skips the column check.
                    const describing = describeRef(code);
                    const { columns: cols, data: rows } = await runSql(code, params);
                    if (!describing) checkResultColumns(cols, rows, sheetColumns(), code);
                    app.ports.docQueried.send({
                      id,
                      data: [
                        cols.map((col) => ({
                          key: col.columnid,
                          name: col.columnid,
                          // The type runSql read off the select item, which is
                          // what POST /query answers with. The sheet's own
                          // declared cols are the last word only where the
                          // select item states no type of its own.
                          type: col.type ?? cols_?.[col.columnid] ?? null,
                        })),
                        ...rows,
                      ],
                    });
                    break;
                  default:
                    throw new Error(`Unsupported query language: ${lang}`);
                }
              } catch (error) {
                const formatted = formatQueryError(error, code);
                app.ports.docErrored.send(formatted);
              }
            },
            300,
          );
          app.ports.queryDoc.subscribe(({ id, data }) => queryDoc(id, data));

          // A sort, a filter or a dragged width lands on the same document as
          // the query, and every change to that document used to start the SQL
          // again. Only these three decide what a run answers. One slot is
          // enough: one sheet is open at a time, and selectDoc clears it so
          // coming back to a sheet still runs its query.
          let lastRun = { id: null, key: null };
          const runQuery = (id, data) => {
            const key = JSON.stringify([data?.lang, data?.code, data?.cols]);
            if (lastRun.id === id && lastRun.key === key) return;
            lastRun = { id, key };
            queryDoc(id, data);
          };

          let ws;
          let netInterval;
          const storedThumb = (id, doc) => {
            if (Stored.get("library")[id])
              Library.set(id, { thumb: docThumb(doc) });
          };
          const storedThumbDebounced = debounce(storedThumb, 500);
          const selectDoc = catchy(async (id, sheetHandle) => {
            const [type, doc_id] = id.split(":");
            debug.log('selectDoc:', id);
            lastRun = { id: null, key: null };

            const libraryEntry = Library.get()[id];
            const doc = libraryEntry?.doc ?? sheetHandle?.doc?.();

            if (!doc) {
              if (type && doc_id) {
                // User-friendly error with collapsible details
                const details = [
                  `In library: ${!!libraryEntry}`,
                  `Handle exists: ${!!sheetHandle}`,
                  `Handle state: ${sheetHandle?.state ?? 'N/A'}`,
                ].join(' | ');
                return app.ports.docErrored.send(
                  `Could not load this document. It may have been deleted or not yet synced.\n\nTry refreshing the page.\n\n[Details: ${details}]`
                );
              }
              return app.ports.docSelected.send({
                id: "",
                data: { doc: { type: "library" } },
              });
            }

            debug.log('Loaded:', id);
            app.ports.docSelected.send({
              id,
              data: { doc: doc && Views.shown(id, { ...doc }) },
            });
            storedThumb(id, doc);
            if (!type || !doc_id) return;
            // A chart is a query whose SQL its settings describe, built by the
            // same chartSql the server uses, so the picture matches the export.
            const chartQuery = (cfg) =>
              cfg?.source ? { lang: "sql", code: chartSql(cfg), cols: { y: "num" } } : null;
            if (type === "query") runQuery(id, doc.data[0]);
            if (type === "chart" && chartQuery(doc.data?.[0])) runQuery(id, chartQuery(doc.data[0]));
            sheetHandle?.on?.("change", (data) => {
              app.ports.docChanged.send({
                id: type + ":" + data.handle.documentId,
                data,
              });
              if (type === "query") runQuery(id, data.doc.data[0]);
              if (type === "chart" && chartQuery(data.doc.data?.[0])) runQuery(id, chartQuery(data.doc.data[0]));
              storedThumbDebounced(id, data.doc);
            });
            if (type === "portal") {
              const portalUrl = `${WS_BASE}/${type}/${doc_id}/sync`;
              let retries = 0;
              const maxRetries = 5;
              const connect = () => {
                ws = new WebSocket(portalUrl);
                const portalTimeout = setTimeout(() => {
                  app.ports.docErrored.send("Live data connection timed out. Try refreshing.");
                  ws?.close();
                }, 10000);
                ws.onmessage = (msg) => {
                  clearTimeout(portalTimeout);
                  retries = 0;
                  app.ports.docChanged.send({
                    id,
                    data: {
                      doc: JSON.parse(msg.data),
                      handle: null,
                      patchInfo: null,
                      patches: [],
                    },
                  });
                };
                ws.onerror = () => {
                  clearTimeout(portalTimeout);
                };
                ws.onclose = (e) => {
                  clearTimeout(portalTimeout);
                  if (e.code === 1000) return;
                  if (retries < maxRetries) {
                    const delay = Math.min(1000 * 2 ** retries, 30000);
                    retries++;
                    setTimeout(connect, delay);
                  } else {
                    app.ports.docErrored.send("Live data connection lost.");
                  }
                };
              };
              connect();
            }
            if (type.startsWith("net-") || type === "alert") {
              const fetchNet = catchy(async () => {
                const token = getAuthToken();
                if (!token) {
                  app.ports.docQueried.send({
                    id,
                    data: [[
                      { key: "created_at", name: "created_at", type: "timestamp" },
                      { key: "body", name: "body", type: "json" },
                    ]],
                  });
                  return;
                }
                const res = await fetch(`${API_BASE}/net/${id}`, {
                  headers: { Authorization: `Bearer ${token}` },
                });
                if (!res.ok) {
                  throw new Error(
                    `Could not load net data (${res.status}): ${httpErrorDetail(
                      await res.text(),
                      res.headers.get("Content-Type") ?? "",
                    )}`,
                  );
                }
                const body = await res.json();
                app.ports.docQueried.send({
                  id,
                  data: [Object.values(body.data[0]), ...body.data.slice(1)],
                });
              }, 'fetchNet');
              fetchNet();
              netInterval = setInterval(fetchNet, 10000);
              if (type === "net-socket") {
                const url = doc.data?.[0]?.url ?? "";
                const notify = (message) =>
                  app.ports.docNotified.send({
                    id,
                    data: { type: "net-status", message },
                  });
                // What the server is told, as distinct from what the page
                // shows. Only on a change of state; the route's own comment says
                // why a close is not one of the states.
                let reported = null;
                const report = catchy(async (status) => {
                  const token = getAuthToken();
                  if (!token || status === reported) return;
                  reported = status;
                  const res = await fetch(`${API_BASE}/library/${id}/socket`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ status }),
                  });
                  // A 403 is somebody watching a sheet they only have read
                  // access to. They may watch the socket and may not write its
                  // health, and that is not a failure of anything.
                  if (!res.ok && res.status !== 403)
                    throw new Error(
                      `Could not report the socket (${res.status}): ${
                        httpErrorDetail(await res.text(), res.headers.get("Content-Type") ?? "")
                      }`,
                    );
                }, 'reportSocket');
                if (/^wss?:\/\//.test(url)) {
                  ws = new WebSocket(url);
                  ws.onopen = () => {
                    notify("connected");
                    report("connected");
                  };
                  ws.onclose = () => notify("disconnected");
                  ws.onerror = () => {
                    notify(`error connecting to ${url}`);
                    report("error");
                  };
                } else if (url) {
                  notify("url must start with ws:// or wss://");
                }
              }
            }
          }, 'selectDoc');

          const changeId = catchy(async (id) => {
            const [, doc_id = ""] = id.split(":");
            if (doc_id === sheet?.documentId) return;
            ws?.close?.();
            clearInterval(netInterval);

            debug.log('changeId:', id);

            if (!doc_id) {
              sheet = null;
              await selectDoc(id, null);
              return;
            }

            // System sheets (bundled examples, tutorial, portals) live in the
            // library entry itself; their ids are not automerge document ids.
            if (Library.get()[id]?.doc) {
              sheet = null;
              await selectDoc(id, null);
              return;
            }

            // Find document in repo with retry logic
            const findWithTimeout = async (retries = 2) => {
              for (let attempt = 0; attempt < retries; attempt++) {
                try {
                  const handle = await repo?.find(doc_id);
                  if (handle?.whenReady) {
                    await Promise.race([
                      handle.whenReady(),
                      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000)),
                    ]);
                  }
                  return handle;
                } catch (err) {
                  debug.warn(`repo.find attempt ${attempt + 1} failed:`, err.message);
                  if (attempt < retries - 1) {
                    await new Promise(r => setTimeout(r, 1000)); // Wait 1s before retry
                  }
                }
              }
              return null;
            };
            try {
              sheet = await findWithTimeout();
            } catch (err) {
              debug.warn('repo.find failed:', err.message);
              sheet = null;
            }

            // A locked link whose password was wrong refuses the handshake, and
            // that 401 is unreadable from script -- so the sheet simply never
            // arrives. Nothing else can tell the two apart, so say which one is
            // likelier rather than leaving an empty page to speak for itself.
            // Reloading asks again, because the password is nowhere kept.
            if (!sheet && linkPass) {
              app.ports.docErrored.send(
                "That password did not open this link, or the sheet is no longer shared. Reload the page to try the password again.",
              );
            }

            await selectDoc(id, sheet);
          }, 'changeId');
          app.ports.changeId.subscribe(changeId);
          changeId(window.location.pathname.slice(1));

          app.ports.newDoc.subscribe(
            catchy(async ({ name, type, data }) => {
              debug.log('newDoc:', { type, name });

              if (!repo) {
                app.ports.docErrored.send('Sync not initialized. Please refresh.');
                return;
              }

              // Create document and wait for it to be ready
              sheet = repo.create({ type, data });
              if (!sheet) {
                app.ports.docErrored.send('Failed to create document.');
                return;
              }

              const id = `${type}:${sheet.documentId}`;
              debug.log('Created:', id);

              if (sheet.whenReady) {
                await sheet.whenReady();
              }

              // Save to localStorage and register with server
              Library.set(id, { name: name ?? "", tags: [] });
              const registered = await registerDocWithRetry(id, name);
              if (!registered)
                app.ports.docErrored.send(
                  `This sheet was created locally but the server rejected its registration, so it will not sync or receive data. Reload and try again.`,
                );

              // Load document without page reload (key fix: keeps sheet handle in memory)
              window.history.pushState({}, '', `/${id}`);
              await selectDoc(id, sheet);
            }, 'newDoc'),
          );

          // Fork: a copy of the sheet you are looking at, owned by you, with a link
          // back to what it came from. It works on a bundled example too, which is
          // what makes "start from a demo" mean anything. `demo` and `example` mark
          // the originals, so a fork does not inherit them and does not turn up in
          // the gallery strip pretending to be one.
          app.ports.forkDoc.subscribe(
            catchy(async (sourceId) => {
              const [type, source_doc_id] = sourceId.split(":");
              const entry = Library.get()[sourceId];
              const source = entry?.doc ??
                (await repo.find(source_doc_id).then(async (h) => (await h.whenReady?.(), h.doc())));
              if (!source?.data) {
                app.ports.docErrored.send(
                  [
                    `I could not fork "@${sourceId}".`,
                    ``,
                    `  Received:     a sheet with no data`,
                    `  Source:       the sheet this page is showing`,
                    `  Fix:          open the sheet once so it loads, then fork it`,
                  ].join("\n"),
                );
                return;
              }
              const name = `${entry?.name || source.name || sourceId} (fork)`;
              const copy = repo.create({
                ...JSON.parse(JSON.stringify(source)),
                name,
                forked_from: sourceId,
              });
              if (copy.whenReady) await copy.whenReady();
              const id = `${type}:${copy.documentId}`;
              const tags = (entry?.tags ?? []).filter((t) => !["demo", "example"].includes(t));
              Library.set(id, { name, tags });
              const registered = await registerDocWithRetry(id, name);
              if (!registered) {
                app.ports.docErrored.send(
                  `This fork was made locally but the server rejected its registration, so it will not sync. Reload and try again.`,
                );
              }
              window.history.pushState({}, "", `/${id}`);
              sheet = copy;
              await selectDoc(id, copy);
            }, "forkDoc"),
          );

          // The chart on screen is the chart you save: the SVG is serialized out of
          // the page rather than drawn a second time, and the PNG is that SVG
          // painted onto a canvas. Nothing is rendered twice, so nothing can drift.
          app.ports.downloadChart.subscribe(
            catchy(async (format) => {
              const svg = document.querySelector("main svg");
              if (!svg) {
                app.ports.docErrored.send("There is no chart on screen to save yet.");
                return;
              }
              const box = svg.viewBox.baseVal;
              const [w, h] = [box.width || 800, box.height || 300];
              const clone = svg.cloneNode(true);
              clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
              clone.setAttribute("width", w);
              clone.setAttribute("height", h);
              // A transparent PNG on a dark slide is an invisible chart.
              const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              bg.setAttribute("width", "100%");
              bg.setAttribute("height", "100%");
              bg.setAttribute("fill", "#fff");
              clone.insertBefore(bg, clone.firstChild);
              const markup = new XMLSerializer().serializeToString(clone);
              const name = (window.location.pathname.slice(1) || "chart") + "." + format;
              const save = (href) => {
                const a = document.createElement("a");
                a.href = href;
                a.download = name;
                a.click();
              };
              if (format === "svg") {
                const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml" }));
                save(url);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                return;
              }
              const img = new Image();
              img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
              await img.decode();
              const canvas = document.createElement("canvas");
              // Twice the viewBox, so the chart is not a blur in a slide deck.
              canvas.width = w * 2;
              canvas.height = h * 2;
              canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
              save(canvas.toDataURL("image/png"));
            }, "downloadChart"),
          );

          app.ports.importCsv.subscribe(
            catchy(async ({ filename, content }) => {
              debug.log('importCsv:', filename);
              const token = getAuthToken();
              if (!token) {
                app.ports.docErrored.send('Please log in to import CSV files.');
                return;
              }
              try {
                const formData = new FormData();
                formData.append('file', new File([content], filename, { type: 'text/csv' }));
                const res = await fetch(`${API_BASE}/import/csv`, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                  },
                  body: formData,
                });
                if (!res.ok) {
                  const text = await res.text();
                  app.ports.docErrored.send(`CSV import failed: ${text || res.statusText}`);
                  return;
                }
                // Refresh library to show the new sheet
                await changeId('');
              } catch (err) {
                app.ports.docErrored.send(`CSV import failed: ${err?.message ?? 'Unknown error'}`);
              }
            }, 'importCsv'),
          );

          // Restore a logged-in session from a previous visit so the UI shows LoggedIn on load.
          const restored = Stored.get("user");
          if (restored.usr_id) app.ports.authResult.send({ usr_id: String(restored.usr_id) });

          // Signup: request a verification email. Never leaves the form locked.
          app.ports.signup.subscribe(async (email) => {
            try {
              const res = await fetch(
                `${API_BASE}/signup?email=${encodeURIComponent(email)}`,
                { method: 'POST' },
              );
              app.ports.authResult.send({});
              app.ports.docErrored.send(
                res.ok
                  ? `Verification email sent to ${email} — check your inbox to set a password.`
                  : 'Signup failed. Please try again.',
              );
            } catch (err) {
              app.ports.authResult.send({});
              app.ports.docErrored.send(`Signup failed: ${err?.message ?? 'unknown error'}`);
            }
          });

          // Login: store { usr_id, jwt } then reload so the sync socket reconnects authenticated.
          app.ports.login.subscribe(async ({ email, password }) => {
            try {
              const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
              });
              if (!res.ok) {
                app.ports.authResult.send({ error: 'Invalid email or password.' });
                app.ports.docErrored.send('Invalid email or password.');
                return;
              }
              const { data } = await res.json();
              Stored.set("user", { usr_id: data.usr_id, jwt: data.jwt });
              location.reload();
            } catch (err) {
              app.ports.authResult.send({ error: err?.message ?? 'Login failed.' });
              app.ports.docErrored.send(`Login failed: ${err?.message ?? 'unknown error'}`);
            }
          });

          // Logout: drop the token and reload so the sync socket reconnects anonymously.
          app.ports.logout.subscribe(() => {
            Stored.clear("user");
            location.reload();
          });

          const applyPatches = (data, patches) => {
            for (const { path, action, value } of patches) {
              switch (path.length) {
                case 0: data[action](...value); break;
                case 1: {
                  const [y] = path;
                  if (action === "set") data[y] = value;
                  // A column moved to another position. The value put back is
                  // the one the document already held, read out before the
                  // delete: Elm's `Col` carries key, name and type only, so a
                  // column rebuilt there would arrive stripped of its own
                  // arrangement. Copied rather than re-inserted because what
                  // comes out of an automerge list is not a value to hand back.
                  else if (action === "move") {
                    const [from, to] = value;
                    const held = JSON.parse(JSON.stringify(data[y][from]));
                    data[y].splice(from, 1);
                    data[y].splice(to, 0, held);
                  }
                  else data[y][action](...value);
                  break;
                }
                case 2: {
                  const [y, x] = path;
                  if (!data[y]) data[y] = {};
                  if (action === "set") data[y][x] = value;
                  else if (action === "del") delete data[y][x];
                  else data[y][x][action](...value);
                  break;
                }
                default: {
                  let target = data;
                  for (let i = 0; i < path.length - 1; i++) {
                    if (!target[path[i]]) target[path[i]] = {};
                    target = target[path[i]];
                  }
                  const last = path[path.length - 1];
                  if (action === "set") target[last] = value;
                  else if (action === "del") delete target[last];
                  else target[last][action](...value);
                  break;
                }
              }
            }
          };

          app.ports.changeDoc.subscribe(
            catchy(async ({ id, data: patches }) => {
              const [type] = id.split(":");
              const doc = Library.get()[id]?.doc;
              if (doc) {
                const d = { ...doc };
                applyPatches(d.data, patches);
                app.ports.docChanged.send({ id, data: { doc: d, handle: null, patchInfo: null, patches } });
                if (type === "query") runQuery(id, d.data[0]);
                return;
              }
              sheet?.change((d) => applyPatches(d.data, patches));
            }, 'changeDoc'),
          );

          // The same write, for a batch that is only ever view fields. Its own
          // port because that is the fact worth having: a sheet whose document
          // cannot hold the arrangement keeps it in this browser, and knowing
          // which patches are an arrangement without inspecting a path is what
          // keeps the list of what a view field is in one language.
          //
          // A sheet ships bundled, or the server has refused a write on it, or
          // it is ours: the first two are kept here, and the first and third are
          // still applied so the session shows them. No query is re-run --
          // sorting a query's result is not a new question.
          app.ports.arrangeDoc.subscribe(
            catchy(async ({ id, data: patches }) => {
              const [, doc_id] = id.split(":");
              const doc = Library.get()[id]?.doc;
              if (refused.has(doc_id) || doc) Views.keep(id, patches);
              if (doc) {
                const d = { ...doc };
                applyPatches(d.data, patches);
                app.ports.docChanged.send({ id, data: { doc: d, handle: null, patchInfo: null, patches } });
                return;
              }
              if (refused.has(doc_id)) return;
              lastArranged = { id, doc_id, patches };
              sheet?.change((d) => applyPatches(d.data, patches));
            }, 'arrangeDoc'),
          );
        }
      } catch (error) {
        console.error('[scrapsheets] Fatal initialization error:', error);
        const detail = `Initialization failed: ${error?.message ?? "Something went wrong."}`;
        // If Elm.Main.init is what threw there is no app and no UI, so the port
        // would leave a blank page with the message only in the console.
        if (app) app.ports.docErrored.send(detail);
        else document.getElementById("elm").textContent = detail;
      }
    </script>
  </body>
</html>
