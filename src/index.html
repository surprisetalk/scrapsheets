<!DOCTYPE html>
<html lang="en">
  <head>
    <title>scrapsheets</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Taylor Troesh" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link href="/style.css" rel="stylesheet" />
    <script src="/index.js"></script>
  </head>
  <body>
    <div id="elm"></div>
    <script type="importmap">
      {
        "imports": {
          "@automerge/automerge": "/automerge.mjs",
          "@automerge/automerge/slim": "/automerge.mjs",
          "@automerge/automerge-repo": "/automerge-repo.mjs",
          "@automerge/automerge-repo/slim": "/automerge-repo.mjs"
        }
      }
    </script>
    <script type="module">
      // Initialize Automerge WASM first
      import { initializeWasm } from "@automerge/automerge";
      await initializeWasm(fetch("/automerge.wasm"));

      // Import Automerge packages
      import { Repo } from "@automerge/automerge-repo";
      import { IndexedDBStorageAdapter } from "/automerge-repo-idb.mjs";
      import { BrowserWebSocketClientAdapter } from "/automerge-repo-ws.mjs";
      import { Col, EXAMPLES, Table } from "/examples.mjs";
      import {
        applyWindows,
        checkCells,
        checkColumnTypes,
        checkRefPath,
        checkResultColumns,
        DESCRIBE_COLUMNS,
        describeRef,
        describeRows,
        formatQueryError,
        nearest,
        checkPivot,
        register,
        rewriteUnpivot,
        rewriteWindows,
        scanRefs,
      } from "/sql.mjs";
      import alasql from "/alasql.mjs";
      // Was a CDN <script> that defined a global. Keep the global so query code
      // and the browser tests can reach it the same way.
      globalThis.alasql = alasql;

      function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            func.apply(this, args);
          }, timeout);
        };
      }

      try {
        const app = Elm.Main.init({
          node: document.getElementById("elm"),
          flags: {
            tutorial: ((v) => (Number.isFinite(v) ? v : 0))(
              parseInt(localStorage.getItem("scrapsheets-tutorial") ?? "0", 10),
            ),
          },
        });

        app.ports.saveTutorial.subscribe((n) =>
          localStorage.setItem("scrapsheets-tutorial", String(n)),
        );

        // Debug logging - set localStorage.debug = 'scrapsheets' to enable verbose logging
        const VERBOSE = localStorage.getItem('debug')?.includes('scrapsheets');
        const debug = {
          log: VERBOSE ? (...args) => console.log('[scrapsheets]', ...args) : () => {},
          error: (...args) => console.error('[scrapsheets]', ...args),
          warn: (...args) => console.warn('[scrapsheets]', ...args),
        };

        function catchy(func, context = 'unknown') {
          return (...args) => {
            try {
              return func.apply(this, args)?.catch((error) => {
                debug.error(`Error in ${context}:`, error);
                app.ports.docErrored.send(
                  `[${context}] ${error?.message ?? "Something went wrong."}`,
                );
              });
            } catch (error) {
              debug.error(`Sync error in ${context}:`, error);
              app.ports.docErrored.send(
                `[${context}] ${error?.message ?? "Something went wrong."}`,
              );
            }
          };
        }

        const docThumb = (doc) => {
          if (doc?.type !== "table" || !Array.isArray(doc.data))
            return { kind: doc?.type ?? "unknown", cols: 0, rows: 0, spark: [] };
          const cols = Object.values(doc.data[0] ?? {});
          let spark = [];
          for (const col of cols) {
            const nums = doc.data
              .slice(1, 21)
              .map((row) => parseFloat(row[col.key]))
              .filter(Number.isFinite);
            if (nums.length < 3) continue;
            const take = nums.slice(0, 16);
            const min = Math.min(...take);
            const max = Math.max(...take);
            spark = take.map((n) =>
              Math.round((max === min ? 0.5 : (n - min) / (max - min)) * 1000) / 1000,
            );
            break;
          }
          return { kind: "table", cols: cols.length, rows: doc.data.length - 1, spark };
        };

        const Library = {
          // Memoized: docThumb over the bundled datasets is too costly per call.
          cache: null,
          get: () => {
            if (Library.cache) return Library.cache;
            const merged = {
              ...JSON.parse(
                localStorage.getItem("scrapsheets-library") ?? "{}",
              ),
              "": {
                name: "library",
                system: true,
                doc: { type: "library" },
              },
              shop: {
                name: "shop",
                system: true,
                doc: { type: "shop" },
              },
              ...Object.fromEntries(
                ["time","stonks","dice","orbit","cafe","forest","words"]
                  .map(p => [`portal:${p}`, { name: `${p} demo`, system: true, doc: { type: "portal", data: null } }])
              ),
              ...EXAMPLES,
              "table:tutorial": {
                name: "tutorial",
                system: true,
                doc: Table(
                  ["step::text", "how::text"].map(Col),
                  ["create a table", "click table:... below"],
                  ["edit a cell", "click a cell and type"],
                  ["create a query", "click query:... below"],
                  ["reference a sheet with @", "type @ in the editor and pick a table"],
                  ["see live results", "try: select * from @table:countries limit 5"],
                ),
              },
            };
            return Library.cache = Object.fromEntries(
              Object.entries(merged).map(([id, entry]) => [
                id,
                entry.doc && !entry.thumb
                  ? { ...entry, thumb: docThumb(entry.doc) }
                  : entry,
              ]),
            );
          },
          set: (id, info) => {
            for (const i in info) if (info[i] === null) delete info[i];
            const library = JSON.parse(
              localStorage.getItem("scrapsheets-library") ?? "{}",
            );
            localStorage.setItem(
              "scrapsheets-library",
              JSON.stringify({
                ...library,
                [id]: { ...library[id], ...info },
              }),
            );
            Library.cache = null;
            app.ports.librarySynced.send(Library.get());
          },
          delete: (id) => {
            const library = JSON.parse(
              localStorage.getItem("scrapsheets-library") ?? "{}",
            );
            localStorage.setItem(
              "scrapsheets-library",
              JSON.stringify({ ...library, [id]: undefined }),
            );
            Library.cache = null;
            app.ports.librarySynced.send(Library.get());
          },
        };
        app.ports.librarySynced.send(Library.get());

        app.ports.deleteDoc.subscribe(async (id) => Library.delete(id));

        app.ports.updateLibrary.subscribe(({ id, data }) => Library.set(id, data));

        // Query editor autocomplete
        const setupQueryEditorTracking = () => {
          const codeEditor = document.getElementById('code');
          if (!codeEditor) return;

          // Track cursor position on input and selection change
          const reportState = () => {
            if (!app.ports.queryEditorState) return;
            const cursorPos = codeEditor.selectionStart;
            const textBeforeCursor = codeEditor.value.substring(0, cursorPos);
            app.ports.queryEditorState.send({ cursorPos, textBeforeCursor });
          };

          codeEditor.addEventListener('input', reportState);
          codeEditor.addEventListener('click', reportState);
          codeEditor.addEventListener('keyup', (e) => {
            // Report on arrow keys and other navigation
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
              reportState();
            }
          });

          // Handle autocomplete keyboard navigation
          codeEditor.addEventListener('keydown', (e) => {
            // Check if autocomplete is showing (hacky but works)
            const dropdown = document.querySelector('[style*="z-index: 100"]');
            if (!dropdown) return;

            if (e.key === 'ArrowDown') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -1, textBeforeCursor: '__NAV_DOWN__' });
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -2, textBeforeCursor: '__NAV_UP__' });
            } else if (e.key === 'Enter' || e.key === 'Tab') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -3, textBeforeCursor: '__SELECT__' });
            } else if (e.key === 'Escape') {
              e.preventDefault();
              app.ports.queryEditorState.send({ cursorPos: -4, textBeforeCursor: '__CLOSE__' });
            }
          });
        };

        // Insert text at cursor in query editor
        app.ports.insertAtCursor.subscribe((text) => {
          const codeEditor = document.getElementById('code');
          if (!codeEditor) return;

          const start = codeEditor.selectionStart;
          const end = codeEditor.selectionEnd;
          const value = codeEditor.value;

          codeEditor.value = value.substring(0, start) + text + value.substring(end);
          codeEditor.selectionStart = codeEditor.selectionEnd = start + text.length;
          codeEditor.focus();

          // Trigger input event so Elm gets the updated value
          codeEditor.dispatchEvent(new Event('input', { bubbles: true }));
        });

        // Re-setup editor tracking when DOM changes (e.g., navigating to a query)
        const observer = new MutationObserver(() => {
          if (document.getElementById('code')) {
            setupQueryEditorTracking();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Clipboard handling
        app.ports.copyToClipboard.subscribe(async (text) => {
          try {
            await navigator.clipboard.writeText(text);
            debug.log('Copied to clipboard:', text.substring(0, 50) + '...');
          } catch (err) {
            debug.error('Failed to copy:', err);
          }
        });

        // Listen for paste events and send to Elm
        document.addEventListener('paste', (e) => {
          // Don't intercept paste when typing in an input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
          }
          e.preventDefault();
          const text = e.clipboardData.getData('text/plain');
          if (text && app.ports.pasteFromClipboard) {
            app.ports.pasteFromClipboard.send(text);
          }
        });

        // Listen for copy events
        document.addEventListener('copy', (e) => {
          // Don't intercept copy when selecting text in an input
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
          }
          // The actual copy is triggered via port, so we just let Elm know
          if (app.ports.requestCopy) {
            e.preventDefault();
            app.ports.requestCopy.send(null);
          }
        });

        {
          // Initialize the Automerge Repo with storage and network adapters
          const getAuthToken = () => {
            try {
              const userData = JSON.parse(
                localStorage.getItem("scrapsheets-user") || "{}",
              );
              return userData.jwt || null;
            } catch {
              return null;
            }
          };

          // Sharing lives here rather than in Elm because the JWT does. Every
          // action re-reads the member list, so the modal never shows stale state.
          app.ports.shareAction.subscribe(catchy(async ({ id, action, email, role, public: isPublic }) => {
            const token = getAuthToken();
            if (!token) {
              return app.ports.docErrored.send("Log in to share a sheet.");
            }
            const api = `https://api.sheets.scrap.land/library/${id}`;
            const send = async (path, method, body) => {
              const res = await fetch(api + path, {
                method,
                headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
              if (!res.ok) throw new Error((await res.json().catch(() => ({})))?.error ?? `${method} ${path} failed (${res.status}).`);
              return await res.json();
            };

            let link;
            if (action === "add") await send("/share", "POST", { email, role });
            else if (action === "remove") await send("/share", "DELETE", { email });
            else if (action === "public") await send("/public", "POST", { public: isPublic });
            else if (action === "link") {
              const { data } = await send("/link", "POST", {});
              link = `${location.origin}/${id}?share=${data.token}`;
            }

            const { data } = await send("/share", "GET");
            app.ports.shareLoaded.send({ members: data.members, public: data.public, ...(link ? { link } : {}) });
          }, 'shareAction'));

          // Register a document with the server, retrying on 404 (sync timing)
          async function registerDocWithRetry(id, name) {
            const token = getAuthToken();
            if (!token) return true; // No auth, skip registration

            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt > 0) {
                await new Promise(r => setTimeout(r, 100 * Math.pow(2, attempt)));
              }
              const res = await fetch(`https://api.sheets.scrap.land/library/${id}`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`,
                },
                body: JSON.stringify({ name: name ?? "", tags: [] }),
              });
              if (res.ok) return true;
              if (res.status !== 404) break; // Only retry on 404 (sync timing)
            }
            return false;
          }

          // A ?share= token in the URL is a view-only credential for one sheet;
          // it rides the same ?auth= parameter, so there is one read path.
          const shareToken = new URLSearchParams(location.search).get("share");
          const token = getAuthToken() ?? shareToken;
          const syncUrl =
            "wss://api.sheets.scrap.land/library/sync" +
            (token ? `?auth=Bearer%20${encodeURIComponent(token)}` : "");

          // Track sync connection status
          const syncStatus = {
            connected: false,
            lastError: null,
            attempts: 0,
          };

          debug.log('Initializing repo with sync URL:', syncUrl);
          const networkAdapter = new BrowserWebSocketClientAdapter(syncUrl);

          const repo = new Repo({
            storage: new IndexedDBStorageAdapter(),
            network: [networkAdapter],
          });

          // Log repo events if available
          if (repo.on) {
            repo.on('document', ({ handle }) => {
              debug.log('Repo received document:', handle.documentId);
            });
          }

          // Expose debug info globally for console access
          window.__scrapsheets = {
            repo,
            syncStatus,
            Library,
            getDocState: (id) => {
              const [type, doc_id] = id.split(':');
              const inLibrary = Library.get()[id];
              return {
                id,
                type,
                doc_id,
                inLibrary: !!inLibrary,
                libraryEntry: inLibrary,
                repoHandles: repo.handles ? Object.keys(repo.handles) : 'N/A',
              };
            },
          };

          let sheet;

          const setupDragDrop = () => {
            document.body.addEventListener("dragover", (e) => {
              e.preventDefault();
              e.stopPropagation();
              e.dataTransfer.dropEffect = "copy";
              document.body.classList.add("drag-over");
            });
            document.body.addEventListener("dragleave", (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.body.classList.remove("drag-over");
            });
            document.body.addEventListener("drop", async (e) => {
              e.preventDefault();
              e.stopPropagation();
              document.body.classList.remove("drag-over");
              const files = Array.from(e.dataTransfer.files).filter(
                (file) =>
                  file.type === "text/csv" ||
                  file.name.endsWith(".csv"),
              );
              for (const file of files) {
                try {
                  const lines = (await file.text())
                    .split("\n")
                    .filter((line) => line.trim());
                  if (!lines.length) return null;
                  const [headers, ...data] = lines.map((row) => {
                    const result = [];
                    let current = "";
                    let inQuotes = false;
                    for (let i = 0; i < row.length; i++) {
                      const char = row[i];
                      if (char === '"') {
                        if (inQuotes && row[i + 1] === '"') {
                          current += '"';
                          i++;
                        } else {
                          inQuotes = !inQuotes;
                        }
                      } else if (char === "," && !inQuotes) {
                        result.push(current.trim());
                        current = "";
                      } else {
                        current += char;
                      }
                    }
                    result.push(current.trim());
                    return result;
                  });
                  if (!headers.length) return;
                  const newSheet = repo.create({
                    type: "table",
                    data: [
                      headers.map((name, key) => ({
                        name,
                        type: "text",
                        key,
                      })),
                      ...data.map((row) => {
                        const rowObj = {};
                        headers.forEach((header, index) => {
                          rowObj[index] = row[index] || "";
                        });
                        return rowObj;
                      }),
                    ],
                  });
                  const id = `table:${newSheet.documentId}`;
                  const csvName = file.name.replace(/\.csv$/i, "");
                  Library.set(id, { name: csvName, tags: [] });

                  // Register document in database with retry for sync timing
                  const registered = await registerDocWithRetry(id, csvName);
                  if (!registered) {
                    console.error("Failed to register CSV document after retries");
                    app.ports.docErrored.send("Failed to save imported file. Please try again.");
                    return;
                  }

                  requestAnimationFrame(() => {
                    window.location = `/${id}`;
                  });
                } catch (error) {
                  console.error("Error processing CSV file:", error);
                  app.ports.docErrored.send(
                    `Error processing ${file.name}: ${error.message}`,
                  );
                }
              }
            });
          };
          if (document.readyState === "loading") {
            document.addEventListener(
              "DOMContentLoaded",
              setupDragDrop,
            );
          } else { setupDragDrop(); }

          alasql.options.modifier = "RECORDSET";
          register(alasql);
          for (
            const type of [
              "image",
              "link",
              "usd",
              "percentage",
              "date",
              "int",
              "float",
            ]
          ) {
            alasql.fn[type] = (data) => ({ type, data });
          }
          // @type:doc_id references resolve in two steps: runSql rewrites them to
          // SHEET('id') and pre-loads each doc (repo.find is async but alasql
          // from-functions are synchronous), then SHEET serves the rows.
          const sheetCache = new Map();
          const sheetCols = new Map();
          // Every column the referenced sheets actually have: what a typo'd
          // column name gets matched against.
          const sheetColumns = () => [
            ...new Set([...sheetCache.values()].flatMap((rows) => Object.keys(rows?.[0] ?? {}))),
          ];
          const toRecords = ([cols, ...rows]) =>
            rows.map((row) => Object.fromEntries(Object.values(cols).map((c) => [c.name, row[c.key]])));
          alasql.from.SHEET = (id, opts, cb, idx, query) => {
            let res = sheetCache.get(id) ??
              (Library.get()[id]?.doc?.data && toRecords(Library.get()[id].doc.data));
            if (!res) {
              const hit = nearest(id, [...sheetCache.keys(), ...Object.keys(Library.get())]);
              throw new Error([
                `I could not load the sheet "${id}".`,
                ``,
                hit ? `  Did you mean: @${hit}` : `  Loaded:       ${[...sheetCache.keys()].join(", ") || "(nothing yet)"}`,
                `  Source:       the @sheet refs in this query`,
                `  Fix:          ${hit ? `write @${hit} instead` : `reference it as @${id} so it loads before the query runs`}`,
              ].join("\n"));
            }
            if (cb) res = cb(res, idx, query);
            return res;
          };
          // What each loaded sheet's columns are called: the declared type row for a
          // table, and whatever the rows carry for a query. checkCells and
          // rewriteUnpivot both read names rather than types.
          const columnsOf = () =>
            Object.fromEntries(
              [...sheetCache].map(([id, rows]) => [
                id,
                sheetCols.get(id) ?? Object.keys(rows?.[0] ?? {}).map((name) => ({ name })),
              ]),
            );
          // scanRefs and checkRefPath are shared with the server (src/sql.mjs), so a
          // query resolves the same way in the page and in POST /query. `path` carries
          // the @query chain that led here, which is what names a cycle. A referenced
          // @query runs through runSql too, so a window inside one is computed rather
          // than handed to AlaSQL.
          const runSql = async (code, params, path = []) => {
            const { sql: out, ids, cells } = scanRefs(code);
            for (const id of new Set(ids)) {
              checkRefPath(path, id);
              const [type, ref_id] = id.split(":");
              if (!["table", "query"].includes(type)) {
                throw new Error(`@${id}: only table and query sheets can be referenced in queries.`);
              }
              const doc = Library.get()[id]?.doc ??
                (await repo.find(ref_id).then(async (h) => (await h.whenReady?.(), h.doc())));
              if (!doc?.data) {
                const known = Object.keys(Library.get()).filter((k) => /^(table|query):/.test(k));
                const hit = nearest(id, known);
                throw new Error(
                  [
                    `@${id}: this sheet has no data.`,
                    ``,
                    hit
                      ? `  Did you mean: @${hit}`
                      : `  Available:    ${known.slice(0, 12).join(", ") || "(none yet)"}`,
                    `  Source:       the @sheet refs in this query`,
                    `  Fix:          ${hit ? `write @${hit} instead` : "open the sheet once so it loads, or check the id"}`,
                  ].join("\n"),
                );
              }
              if (type === "query") {
                sheetCache.set(id, (await runSql(doc.data[0].code, { "": null }, [...path, id])).data);
              } else {
                sheetCache.set(id, toRecords(doc.data));
                // Declared types, kept beside the rows so checkColumnTypes runs after
                // loading rather than during it: describe must still work on a sheet
                // whose cells are wrong.
                sheetCols.set(id, Object.values(doc.data[0]));
                checkColumnTypes(id, sheetCols.get(id), sheetCache.get(id));
              }
            }
            // Same order as the server: a cell reference needs its sheet loaded,
            // unpivot needs its column names, and the window pass runs on whatever
            // those leave behind.
            checkCells(cells, Object.fromEntries(sheetCache), columnsOf());
            checkPivot(out);
            const plan = rewriteWindows(rewriteUnpivot(out, columnsOf()));
            const [, result = {}] = await alasql([[`set @params = ?`, [params]], plan.sql]);
            return plan.windows.length
              ? applyWindows(result, plan, (q, p) => alasql(q, p).data)
              : result;
          };
          // Pull the origin's own words out of an error body so the message names a cause,
          // not just a status code (arxiv hides it in <entry><summary>, most APIs in JSON).
          const httpErrorDetail = (text, contentType) => {
            if (/xml/.test(contentType)) {
              const detail = new DOMParser()
                .parseFromString(text, "text/xml")
                .querySelector("entry > summary, error, message")
                ?.textContent?.trim();
              if (detail) return detail;
            }
            if (/json/.test(contentType)) {
              try {
                const body = JSON.parse(text);
                const detail = body?.error?.info ?? body?.error?.message ?? body?.error ??
                  body?.message;
                if (detail) return typeof detail === "string" ? detail : JSON.stringify(detail);
              } catch { /* not actually json; fall through to the raw body */ }
            }
            return text.trim().slice(0, 300) || "(empty body)";
          };
          alasql.fn.http = (url, qs = {}) => {
            const atomToJson = (xmlString) => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(xmlString, "text/xml");
              const feed = {
                title: doc.querySelector("feed > title")?.textContent,
                updated: doc.querySelector("feed > updated")
                  ?.textContent,
                totalResults: parseInt(
                  doc.querySelector("totalResults")?.textContent || "0",
                ),
                entries: [],
              };
              doc.querySelectorAll("entry").forEach((entry) => {
                feed.entries.push({
                  id: entry.querySelector("id")?.textContent,
                  title: entry.querySelector("title")?.textContent
                    ?.trim(),
                  summary: entry.querySelector("summary")?.textContent
                    ?.trim(),
                  published: entry.querySelector("published")
                    ?.textContent,
                  updated: entry.querySelector("updated")?.textContent,
                  authors: Array.from(
                    entry.querySelectorAll("author name"),
                  ).map((a) => a.textContent),
                  links: Array.from(entry.querySelectorAll("link")).map(
                    (l) => ({
                      href: l.getAttribute("href"),
                      rel: l.getAttribute("rel"),
                      type: l.getAttribute("type"),
                    }),
                  ),
                  categories: Array.from(
                    entry.querySelectorAll("category"),
                  ).map((c) => c.getAttribute("term")),
                });
              });
              return feed;
            };
            const parsers = {
              "application/atom+xml": atomToJson,
            };
            if (!url) return;
            // Route external URLs through proxy to avoid CORS issues
            const apiBase = "https://api.sheets.scrap.land";
            const isExternal = !url.startsWith(window.location.origin) && !url.startsWith(apiBase);
            const fullUrl = url + "?" + new URLSearchParams(qs);
            const targetUrl = isExternal
              ? `${apiBase}/proxy?url=${encodeURIComponent(fullUrl)}`
              : fullUrl;
            const request = new XMLHttpRequest();
            request.open(
              "GET",
              targetUrl,
              false,
            ); // `false` makes the request synchronous
            request.send(null);
            const contentType = request
              .getResponseHeader("Content-Type")
              ?.replace(/;.*$/, "") || "application/json";
            if (!request.status)
              throw new Error([
                `I could not reach this server:`,
                ``,
                `  ${fullUrl}`,
                ``,
                `The request failed before a response arrived. The host may be down, or it`,
                `may refuse cross-origin requests.`,
              ].join("\n"));
            // The proxy forwards the origin status verbatim, so X-Proxy-Status tells
            // us whether the origin or the proxy itself rejected the request.
            if (request.status >= 400)
              throw new Error([
                isExternal && !request.getResponseHeader("X-Proxy-Status")
                  ? `The scrapsheets proxy rejected this request with ${request.status}:`
                  : `This server responded with ${request.status}:`,
                ``,
                `  ${fullUrl}`,
                ``,
                `It said:`,
                ``,
                `  ${httpErrorDetail(request.responseText, contentType)}`,
              ].join("\n"));
            try {
              return {
                status: request.status,
                res: (parsers[contentType] ?? JSON.parse)(request.responseText) || null,
              };
            } catch (err) {
              throw new Error([
                `This server sent ${contentType}, which I could not parse:`,
                ``,
                `  ${fullUrl}`,
                ``,
                `  ${err.message}`,
                ``,
                `The response starts with:`,
                ``,
                `  ${request.responseText.trim().slice(0, 200) || "(empty body)"}`,
              ].join("\n"));
            }
          };
          alasql.from.HTTP = (url, qs = {}) => alasql.fn.http(url, qs).res;
          const queryDoc = debounce(
            async (id, { code, lang, args, cols: cols_ = {} }) => {
              try {
                switch (lang) {
                  case "sql":
                    // TODO: Run alasql if possible, otherwise post to /query.
                    const params = new URLSearchParams(window.location.search)
                      .get("q")
                      ?.split(/\s+(?=\w+=)/)
                      .reduce(
                        (r, p) => {
                          const [k, v] = p.includes("=") ? p.split("=") : ["", p];
                          return ((r[k] ||= []).push(v), r);
                        },
                        { "": [].join(" ") },
                      ) ?? { "": null };
                    // `describe @table:abc` never reaches the engine: it loads the one
                    // sheet it names and reports its shape. Shared with the server.
                    // `describe @table:abc` never reaches the engine: it loads the one
                    // sheet it names and reports its shape. Shared with the server.
                    const described = describeRef(code);
                    if (described) {
                      await runSql(`select 1 from @${described}`, params);
                      const known = sheetCache.get(described) ?? [];
                      app.ports.docQueried.send({
                        id,
                        data: [
                          DESCRIBE_COLUMNS.map((name) => ({ key: name, name, type: null })),
                          ...describeRows(
                            described,
                            sheetCols.get(described) ??
                              Object.keys(known[0] ?? {}).map((name) => ({ name, type: "text" })),
                            known,
                          ),
                        ],
                      });
                      break;
                    }
                    const { columns: cols, data: rows } = await runSql(code, params);
                    checkResultColumns(cols, rows, sheetColumns(), code);
                    // TODO: If doc contains cols data, use that names and types.
                    app.ports.docQueried.send({
                      id,
                      data: [
                        cols.map((col) => ({
                          key: col.columnid,
                          name: col.columnid,
                          type: cols_?.[col.columnid] ?? null,
                        })),
                        ...rows,
                      ],
                    });
                    break;
                  default:
                    throw new Error(`Unsupported query language: ${lang}`);
                }
              } catch (error) {
                const formatted = formatQueryError(error, code);
                app.ports.docErrored.send(formatted);
              }
            },
            300,
          );
          app.ports.queryDoc.subscribe(({ id, data }) => queryDoc(id, data));

          let ws;
          let netInterval;
          const storedThumb = (id, doc) => {
            if (JSON.parse(localStorage.getItem("scrapsheets-library") ?? "{}")[id])
              Library.set(id, { thumb: docThumb(doc) });
          };
          const storedThumbDebounced = debounce(storedThumb, 500);
          const selectDoc = catchy(async (id, sheetHandle) => {
            const [type, doc_id] = id.split(":");
            debug.log('selectDoc:', id);

            const libraryEntry = Library.get()[id];
            const doc = libraryEntry?.doc ?? sheetHandle?.doc?.();

            if (!doc) {
              if (type && doc_id) {
                // User-friendly error with collapsible details
                const details = [
                  `In library: ${!!libraryEntry}`,
                  `Handle exists: ${!!sheetHandle}`,
                  `Handle state: ${sheetHandle?.state ?? 'N/A'}`,
                ].join(' | ');
                return app.ports.docErrored.send(
                  `Could not load this document. It may have been deleted or not yet synced.\n\nTry refreshing the page.\n\n[Details: ${details}]`
                );
              }
              return app.ports.docSelected.send({
                id: "",
                data: { doc: { type: "library" } },
              });
            }

            debug.log('Loaded:', id);
            app.ports.docSelected.send({
              id,
              data: { doc: doc && { ...doc } },
            });
            storedThumb(id, doc);
            if (!type || !doc_id) return;
            if (type === "query") queryDoc(id, doc.data[0]);
            sheetHandle?.on?.("change", (data) => {
              app.ports.docChanged.send({
                id: type + ":" + data.handle.documentId,
                data,
              });
              if (type === "query") queryDoc(id, data.doc.data[0]);
              storedThumbDebounced(id, data.doc);
            });
            if (type === "portal") {
              const portalUrl = `wss://api.sheets.scrap.land/${type}/${doc_id}/sync`;
              let retries = 0;
              const maxRetries = 5;
              const connect = () => {
                ws = new WebSocket(portalUrl);
                const portalTimeout = setTimeout(() => {
                  app.ports.docErrored.send("Live data connection timed out. Try refreshing.");
                  ws?.close();
                }, 10000);
                ws.onmessage = (msg) => {
                  clearTimeout(portalTimeout);
                  retries = 0;
                  app.ports.docChanged.send({
                    id,
                    data: {
                      doc: JSON.parse(msg.data),
                      handle: null,
                      patchInfo: null,
                      patches: [],
                    },
                  });
                };
                ws.onerror = () => {
                  clearTimeout(portalTimeout);
                };
                ws.onclose = (e) => {
                  clearTimeout(portalTimeout);
                  if (e.code === 1000) return;
                  if (retries < maxRetries) {
                    const delay = Math.min(1000 * 2 ** retries, 30000);
                    retries++;
                    setTimeout(connect, delay);
                  } else {
                    app.ports.docErrored.send("Live data connection lost.");
                  }
                };
              };
              connect();
            }
            if (type.startsWith("net-") || type === "alert") {
              const fetchNet = catchy(async () => {
                const token = getAuthToken();
                if (!token) {
                  app.ports.docQueried.send({
                    id,
                    data: [[
                      { key: "created_at", name: "created_at", type: "timestamp" },
                      { key: "body", name: "body", type: "json" },
                    ]],
                  });
                  return;
                }
                const res = await fetch(`https://api.sheets.scrap.land/net/${id}`, {
                  headers: { Authorization: `Bearer ${token}` },
                });
                if (!res.ok) {
                  throw new Error(
                    `Could not load net data (${res.status}): ${httpErrorDetail(
                      await res.text(),
                      res.headers.get("Content-Type") ?? "",
                    )}`,
                  );
                }
                const body = await res.json();
                app.ports.docQueried.send({
                  id,
                  data: [Object.values(body.data[0]), ...body.data.slice(1)],
                });
              }, 'fetchNet');
              fetchNet();
              netInterval = setInterval(fetchNet, 10000);
              if (type === "net-socket") {
                const url = doc.data?.[0]?.url ?? "";
                const notify = (message) =>
                  app.ports.docNotified.send({
                    id,
                    data: { type: "net-status", message },
                  });
                if (/^wss?:\/\//.test(url)) {
                  ws = new WebSocket(url);
                  ws.onopen = () => notify("connected");
                  ws.onclose = () => notify("disconnected");
                  ws.onerror = () => notify(`error connecting to ${url}`);
                } else if (url) {
                  notify("url must start with ws:// or wss://");
                }
              }
            }
          }, 'selectDoc');

          const changeId = catchy(async (id) => {
            const [type, doc_id = ""] = id.split(":");
            if (doc_id === sheet?.documentId) return;
            ws?.close?.();
            clearInterval(netInterval);

            debug.log('changeId:', id);

            if (!doc_id) {
              sheet = null;
              await selectDoc(id, null);
              return;
            }

            // System sheets (bundled examples, tutorial, portals) live in the
            // library entry itself; their ids are not automerge document ids.
            if (Library.get()[id]?.doc) {
              sheet = null;
              await selectDoc(id, null);
              return;
            }

            // Find document in repo with retry logic
            const findWithTimeout = async (retries = 2) => {
              for (let attempt = 0; attempt < retries; attempt++) {
                try {
                  const handle = await repo?.find(doc_id);
                  if (handle?.whenReady) {
                    await Promise.race([
                      handle.whenReady(),
                      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000)),
                    ]);
                  }
                  return handle;
                } catch (err) {
                  debug.warn(`repo.find attempt ${attempt + 1} failed:`, err.message);
                  if (attempt < retries - 1) {
                    await new Promise(r => setTimeout(r, 1000)); // Wait 1s before retry
                  }
                }
              }
              return null;
            };
            try {
              sheet = await findWithTimeout();
            } catch (err) {
              debug.warn('repo.find failed:', err.message);
              sheet = null;
            }

            await selectDoc(id, sheet);
          }, 'changeId');
          app.ports.changeId.subscribe(changeId);
          changeId(window.location.pathname.slice(1));

          app.ports.newDoc.subscribe(
            catchy(async ({ name, type, data }) => {
              debug.log('newDoc:', { type, name });

              if (!repo) {
                app.ports.docErrored.send('Sync not initialized. Please refresh.');
                return;
              }

              // Create document and wait for it to be ready
              sheet = repo.create({ type, data });
              if (!sheet) {
                app.ports.docErrored.send('Failed to create document.');
                return;
              }

              const id = `${type}:${sheet.documentId}`;
              debug.log('Created:', id);

              if (sheet.whenReady) {
                await sheet.whenReady();
              }

              // Save to localStorage and register with server
              Library.set(id, { name: name ?? "", tags: [] });
              const registered = await registerDocWithRetry(id, name);
              if (!registered)
                app.ports.docErrored.send(
                  `This sheet was created locally but the server rejected its registration, so it will not sync or receive data. Reload and try again.`,
                );

              // Load document without page reload (key fix: keeps sheet handle in memory)
              window.history.pushState({}, '', `/${id}`);
              await selectDoc(id, sheet);
            }, 'newDoc'),
          );

          // Fork: a copy of the sheet you are looking at, owned by you, with a link
          // back to what it came from. It works on a bundled example too, which is
          // what makes "start from a demo" mean anything. `demo` and `example` mark
          // the originals, so a fork does not inherit them and does not turn up in
          // the gallery strip pretending to be one.
          app.ports.forkDoc.subscribe(
            catchy(async (sourceId) => {
              const [type, source_doc_id] = sourceId.split(":");
              const entry = Library.get()[sourceId];
              const source = entry?.doc ??
                (await repo.find(source_doc_id).then(async (h) => (await h.whenReady?.(), h.doc())));
              if (!source?.data) {
                app.ports.docErrored.send(
                  [
                    `I could not fork "@${sourceId}".`,
                    ``,
                    `  Received:     a sheet with no data`,
                    `  Source:       the sheet this page is showing`,
                    `  Fix:          open the sheet once so it loads, then fork it`,
                  ].join("\n"),
                );
                return;
              }
              const name = `${entry?.name || source.name || sourceId} (fork)`;
              const copy = repo.create({
                ...JSON.parse(JSON.stringify(source)),
                name,
                forked_from: sourceId,
              });
              if (copy.whenReady) await copy.whenReady();
              const id = `${type}:${copy.documentId}`;
              const tags = (entry?.tags ?? []).filter((t) => !["demo", "example"].includes(t));
              Library.set(id, { name, tags });
              const registered = await registerDocWithRetry(id, name);
              if (!registered) {
                app.ports.docErrored.send(
                  `This fork was made locally but the server rejected its registration, so it will not sync. Reload and try again.`,
                );
              }
              window.history.pushState({}, "", `/${id}`);
              sheet = copy;
              await selectDoc(id, copy);
            }, "forkDoc"),
          );

          app.ports.importCsv.subscribe(
            catchy(async ({ filename, content }) => {
              debug.log('importCsv:', filename);
              const token = getAuthToken();
              if (!token) {
                app.ports.docErrored.send('Please log in to import CSV files.');
                return;
              }
              try {
                const formData = new FormData();
                formData.append('file', new File([content], filename, { type: 'text/csv' }));
                const res = await fetch('https://api.sheets.scrap.land/import/csv', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                  },
                  body: formData,
                });
                if (!res.ok) {
                  const text = await res.text();
                  app.ports.docErrored.send(`CSV import failed: ${text || res.statusText}`);
                  return;
                }
                // Refresh library to show the new sheet
                await changeId('');
              } catch (err) {
                app.ports.docErrored.send(`CSV import failed: ${err?.message ?? 'Unknown error'}`);
              }
            }, 'importCsv'),
          );

          // Restore a logged-in session from a previous visit so the UI shows LoggedIn on load.
          try {
            const stored = JSON.parse(localStorage.getItem('scrapsheets-user') || 'null');
            if (stored?.usr_id) app.ports.authResult.send({ usr_id: String(stored.usr_id) });
          } catch { /* ignore malformed storage */ }

          // Signup: request a verification email. Never leaves the form locked.
          app.ports.signup.subscribe(async (email) => {
            try {
              const res = await fetch(
                `https://api.sheets.scrap.land/signup?email=${encodeURIComponent(email)}`,
                { method: 'POST' },
              );
              app.ports.authResult.send({});
              app.ports.docErrored.send(
                res.ok
                  ? `Verification email sent to ${email} — check your inbox to set a password.`
                  : 'Signup failed. Please try again.',
              );
            } catch (err) {
              app.ports.authResult.send({});
              app.ports.docErrored.send(`Signup failed: ${err?.message ?? 'unknown error'}`);
            }
          });

          // Login: store { usr_id, jwt } then reload so the sync socket reconnects authenticated.
          app.ports.login.subscribe(async ({ email, password }) => {
            try {
              const res = await fetch('https://api.sheets.scrap.land/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
              });
              if (!res.ok) {
                app.ports.authResult.send({ error: 'Invalid email or password.' });
                app.ports.docErrored.send('Invalid email or password.');
                return;
              }
              const { data } = await res.json();
              localStorage.setItem(
                'scrapsheets-user',
                JSON.stringify({ usr_id: data.usr_id, jwt: data.jwt }),
              );
              location.reload();
            } catch (err) {
              app.ports.authResult.send({ error: err?.message ?? 'Login failed.' });
              app.ports.docErrored.send(`Login failed: ${err?.message ?? 'unknown error'}`);
            }
          });

          // Logout: drop the token and reload so the sync socket reconnects anonymously.
          app.ports.logout.subscribe(() => {
            localStorage.removeItem('scrapsheets-user');
            location.reload();
          });

          const applyPatches = (data, patches) => {
            for (const { path, action, value } of patches) {
              switch (path.length) {
                case 0: data[action](...value); break;
                case 1: {
                  const [y] = path;
                  if (action === "set") data[y] = value;
                  else data[y][action](...value);
                  break;
                }
                case 2: {
                  const [y, x] = path;
                  if (!data[y]) data[y] = {};
                  if (action === "set") data[y][x] = value;
                  else if (action === "del") delete data[y][x];
                  else data[y][x][action](...value);
                  break;
                }
                default: {
                  let target = data;
                  for (let i = 0; i < path.length - 1; i++) {
                    if (!target[path[i]]) target[path[i]] = {};
                    target = target[path[i]];
                  }
                  const last = path[path.length - 1];
                  if (action === "set") target[last] = value;
                  else if (action === "del") delete target[last];
                  else target[last][action](...value);
                  break;
                }
              }
            }
          };

          app.ports.changeDoc.subscribe(
            catchy(async ({ id, data: patches }) => {
              const [type] = id.split(":");
              const doc = Library.get()[id]?.doc;
              if (doc) {
                const d = { ...doc };
                applyPatches(d.data, patches);
                app.ports.docChanged.send({ id, data: { doc: d, handle: null, patchInfo: null, patches } });
                if (type === "query") queryDoc(id, d.data[0]);
                return;
              }
              sheet?.change((d) => applyPatches(d.data, patches));
            }, 'changeDoc'),
          );
        }
      } catch (error) {
        console.error('[scrapsheets] Fatal initialization error:', error);
        app.ports.docErrored.send(
          `Initialization failed: ${error?.message ?? "Something went wrong."}`,
        );
      }
    </script>
  </body>
</html>
